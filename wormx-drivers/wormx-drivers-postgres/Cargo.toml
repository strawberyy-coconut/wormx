[package]
name = "wormx-drivers-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL dialect and compile-time introspection for wormx."

[dependencies]
wormx-core = { path = "../../wormx-core", version = "0.1.0" }
sqlx-core = { workspace = true }
sqlx-postgres = { workspace = true }

wormx-macros-core = { path = "../../wormx-macros-core", version = "0.1.0", optional = true, default-features = false }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
macros = [
    "dep:wormx-macros-core",
    "dep:serde_json",
    "dep:tokio",
    "sqlx-core/offline",
    "sqlx-core/_rt-tokio",
    "sqlx-postgres/offline",
]

chrono = ["sqlx-core/chrono", "sqlx-postgres/chrono"]
time = ["sqlx-core/time", "sqlx-postgres/time"]
uuid = ["sqlx-core/uuid", "sqlx-postgres/uuid"]
json = ["sqlx-core/json", "sqlx-postgres/json"]
bigdecimal = ["sqlx-core/bigdecimal", "sqlx-postgres/bigdecimal"]
rust_decimal = ["sqlx-core/rust_decimal", "sqlx-postgres/rust_decimal"]
