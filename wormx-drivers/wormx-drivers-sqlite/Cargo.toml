[package]
name = "wormx-drivers-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite dialect and compile-time introspection for wormx."
readme = "README.md"

[dependencies]
wormx-core = { path = "../../wormx-core", version = "0.2.0" }
sqlx-core = { workspace = true }
sqlx-sqlite = { workspace = true, features = ["bundled"] }

wormx-macros-core = { path = "../../wormx-macros-core", version = "0.2.0", optional = true, default-features = false }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
macros = [
    "dep:wormx-macros-core",
    "dep:serde_json",
    "dep:tokio",
    "sqlx-core/offline",
    "sqlx-sqlite/offline",
]

chrono = ["sqlx-core/chrono", "sqlx-sqlite/chrono"]
time = ["sqlx-core/time", "sqlx-sqlite/time"]
uuid = ["sqlx-core/uuid", "sqlx-sqlite/uuid"]
json = ["sqlx-core/json", "sqlx-sqlite/json"]
bigdecimal = ["sqlx-core/bigdecimal", "sqlx-sqlite/bigdecimal"]
rust_decimal = ["sqlx-core/rust_decimal", "sqlx-sqlite/rust_decimal"]
