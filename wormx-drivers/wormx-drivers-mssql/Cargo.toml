[package]
name = "wormx-drivers-mssql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Microsoft SQL Server dialect and compile-time introspection for wormx."

[dependencies]
wormx-core = { path = "../../wormx-core", version = "0.1.0" }
sqlx-core = { workspace = true }
sqlx-mssql-rs = { workspace = true }

wormx-macros-core = { path = "../../wormx-macros-core", version = "0.1.0", optional = true, default-features = false }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
macros = [
    "dep:wormx-macros-core",
    "dep:serde_json",
    "dep:tokio",
    "sqlx-core/offline",
    "sqlx-mssql-rs/offline",
]

chrono = ["sqlx-core/chrono", "sqlx-mssql-rs/chrono"]
time = ["sqlx-core/time", "sqlx-mssql-rs/time"]
uuid = ["sqlx-core/uuid", "sqlx-mssql-rs/uuid"]
# `sqlx-mssql-rs` 0.1.0's `json` feature enables `serde_json` but not `serde`, so
# enabling it currently fails to compile the driver. Enable forwarding once that
# is fixed upstream.
json = []
bigdecimal = ["sqlx-core/bigdecimal", "sqlx-mssql-rs/bigdecimal"]
rust_decimal = ["sqlx-core/rust_decimal", "sqlx-mssql-rs/rust_decimal"]
