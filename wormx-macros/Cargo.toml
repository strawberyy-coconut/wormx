[package]
name = "wormx-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The wormx::table! procedural macro."
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
wormx-macros-core = { path = "../wormx-macros-core", version = "0.2.1", default-features = false }
wormx-drivers = { path = "../wormx-drivers", version = "0.2.1", optional = true, default-features = false }
proc-macro2 = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }

[features]
default = []
postgres = ["dep:wormx-drivers", "wormx-drivers/macros-postgres"]
sqlite = ["dep:wormx-drivers", "wormx-drivers/macros-sqlite"]
mysql = ["dep:wormx-drivers", "wormx-drivers/macros-mysql"]
mssql = ["dep:wormx-drivers", "wormx-drivers/macros-mssql"]

chrono = ["wormx-drivers?/chrono"]
time = ["wormx-drivers?/time"]
uuid = ["wormx-drivers?/uuid"]
json = ["wormx-drivers?/json"]
bigdecimal = ["wormx-drivers?/bigdecimal"]
rust_decimal = ["wormx-drivers?/rust_decimal"]
